name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: python -m ruff check modal_cockpit tests

      - name: Tests
        run: python -m pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          tar -tf dist/*.tar.gz | grep 'tests/conftest.py'
          tar -tf dist/*.tar.gz | grep 'AGENTS.md'
      - name: Wheel smoke test
        run: |
          python -m venv /tmp/modal-cockpit-wheel-smoke
          /tmp/modal-cockpit-wheel-smoke/bin/pip install dist/*.whl
          /tmp/modal-cockpit-wheel-smoke/bin/modal-cockpit --version
          /tmp/modal-cockpit-wheel-smoke/bin/python -m modal_cockpit --version
