[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-cockpit"
version = "0.2.2"
description = "Safe multi-account switcher and volume transfer tool for Modal CLI profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    {name = "modal-cockpit contributors"},
]
keywords = ["modal", "cli", "accounts", "credentials", "secrets-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography==50.0.2",
    "tomlkit==0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.5",
]

[project.urls]
Homepage = "https://github.com/dkzzum/modal-cockpit"
Repository = "https://github.com/dkzzum/modal-cockpit"
Issues = "https://github.com/dkzzum/modal-cockpit/issues"

[project.scripts]
modal-cockpit = "modal_cockpit.cli:main"

[tool.setuptools.packages.find]
include = ["modal_cockpit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
